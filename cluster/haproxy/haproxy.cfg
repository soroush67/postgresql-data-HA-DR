# HAProxy in front of the Patroni cluster. Health is decided by the Patroni
# REST API, so after a failover traffic moves to the new primary in seconds.
#   :5432  read-write  -> current primary   (GET /primary  == 200)
#   :5433  read-only   -> healthy replicas  (GET /replica  == 200)
#   :7000  statistics page
global
    maxconn 2000
    log stdout format raw local0 info

# Docker's DNS: a node that is recreated gets its new IP. "hold nx/obsolete"
# keep the last IP when a crashed container's name disappears, so the health
# check marks it DOWN and on-marked-down closes its sessions (without the
# hold it goes to MAINT and hung client sessions are never closed).
resolvers docker
    nameserver dns 127.0.0.11:53
    hold valid 10s
    hold nx 300s
    hold obsolete 300s

defaults
    log global
    mode tcp
    retries 2
    timeout client 30m
    timeout server 30m
    timeout connect 4s
    timeout check 5s

listen stats
    mode http
    bind *:7000
    stats enable
    stats uri /
    stats refresh 5s

listen primary
    bind *:5432
    option httpchk
    http-check send meth GET uri /primary
    http-check expect status 200
    default-server inter 3s fall 3 rise 2 on-marked-down shutdown-sessions resolvers docker init-addr last,libc,none
    server pg1 pg1:5432 maxconn 500 check port 8008
    server pg2 pg2:5432 maxconn 500 check port 8008
    server pg3 pg3:5432 maxconn 500 check port 8008

listen replicas
    bind *:5433
    balance roundrobin
    option httpchk
    http-check send meth GET uri /replica
    http-check expect status 200
    default-server inter 3s fall 3 rise 2 on-marked-down shutdown-sessions resolvers docker init-addr last,libc,none
    server pg1 pg1:5432 maxconn 500 check port 8008
    server pg2 pg2:5432 maxconn 500 check port 8008
    server pg3 pg3:5432 maxconn 500 check port 8008
