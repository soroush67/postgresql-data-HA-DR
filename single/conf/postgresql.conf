# PostgreSQL 17 - single node, production settings for a ~15 GB database on a
# host with >= 8 GB RAM given to this container. Scale shared_buffers (25% of
# RAM), effective_cache_size (~75%) and work_mem with your hardware.

# --- connections ------------------------------------------------------------
listen_addresses = '*'
port = 5432
max_connections = 200
superuser_reserved_connections = 5
password_encryption = scram-sha-256
hba_file = '/etc/postgresql/pg_hba.conf'

# --- memory -----------------------------------------------------------------
shared_buffers = 2GB
effective_cache_size = 6GB
work_mem = 32MB
maintenance_work_mem = 512MB
huge_pages = try

# --- WAL / checkpoints ------------------------------------------------------
wal_level = replica
wal_compression = lz4
wal_buffers = 64MB
max_wal_size = 8GB
min_wal_size = 1GB
checkpoint_timeout = 15min
checkpoint_completion_target = 0.9
max_wal_senders = 10
max_replication_slots = 10

# --- archiving: every WAL segment goes to pgBackRest (DR, point-in-time recovery)
archive_mode = on
archive_command = 'pgbackrest --stanza=main archive-push %p'
archive_timeout = 60s

# --- planner / IO (SSD) -----------------------------------------------------
random_page_cost = 1.1
effective_io_concurrency = 200
default_statistics_target = 200
max_worker_processes = 8
max_parallel_workers = 8
max_parallel_workers_per_gather = 4
max_parallel_maintenance_workers = 4

# --- autovacuum -------------------------------------------------------------
autovacuum_max_workers = 4
autovacuum_vacuum_scale_factor = 0.05
autovacuum_analyze_scale_factor = 0.02
autovacuum_vacuum_cost_limit = 2000

# --- logging (to stderr -> docker logs) -------------------------------------
logging_collector = off
log_destination = 'stderr'
log_line_prefix = '%m [%p] %q%u@%d '
log_min_duration_statement = 1000
log_checkpoints = on
log_connections = off
log_lock_waits = on
log_temp_files = 64MB
log_autovacuum_min_duration = 10s

# --- statistics -------------------------------------------------------------
shared_preload_libraries = 'pg_stat_statements'
track_io_timing = on
pg_stat_statements.track = all

# --- locale -----------------------------------------------------------------
timezone = 'UTC'
datestyle = 'iso, mdy'
lc_messages = 'en_US.utf8'
default_text_search_config = 'pg_catalog.english'
